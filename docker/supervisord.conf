[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
; Sin esto supervisor busca su socket en /var/run, que no es escribible por el
; usuario sin privilegios al que baja el entrypoint.
[unix_http_server]
file=/tmp/supervisor.sock

; ── nginx ────────────────────────────────────────────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
; Sin privilegios. Puede seguir atando al puerto 80 porque Docker arranca los
; contenedores con net.ipv4.ip_unprivileged_port_start=0; cambiar el puerto
; obligaría a tocar el "${PORT}:80" de los composes y el de cualquiera que
; tenga el suyo propio.
user=gaia
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── uvicorn (backend FastAPI) ─────────────────────────────────────────────────
[program:uvicorn]
command=python /app/main.py
directory=/app
; El proceso que toca /data y habla con los proveedores: sin privilegios.
user=gaia
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; HOME apuntaba a /root, que el usuario sin privilegios no puede leer: cualquier
; librería que guarde caché en ~ fallaría.
environment=HOME="/home/gaia"
