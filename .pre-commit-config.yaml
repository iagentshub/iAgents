repos:
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^install\.sh$

  - repo: local
    hooks:
      # `docker compose config` a secas solo mira el fichero por defecto, así
      # que de los cinco composes se validaba uno mientras el files: de aquí
      # decía que se validaban todos. El script los recorre como se usan de
      # verdad: dev.yml apilado sobre el base, y los que exigen variables con
      # ${VAR:?} rellenas para poder comprobar la estructura.
      - id: docker-compose-validate
        name: Validan los 5 composes
        entry: sh scripts/validar-composes.sh
        language: system
        files: ^(docker-compose.*\.yml|scripts/validar-composes\.sh)$
        pass_filenames: false

      - id: gaia-py-syntax
        name: Compile gaia.py
        entry: python3 -m py_compile
        language: system
        files: ^gaia\.py$

      # Solo el BOM, no el analizador entero: el hook tiene que correr en
      # cualquier máquina y PSScriptAnalyzer no está instalado de serie. Sin BOM
      # el instalador no parsea en Windows PowerShell 5.1 (ver validate.yml).
      - id: install-ps1-bom
        name: install.ps1 conserva el BOM UTF-8
        entry: |-
          python3 -c "import sys;[sys.exit(f'{p} sin BOM UTF-8, no parseara en PowerShell 5.1') for p in sys.argv[1:] if open(p,'rb').read(3)!=b'\xef\xbb\xbf']"
        language: system
        files: ^install\.ps1$

      # CLAUDE.md tiene que estar en DOS sitios y no hay forma de evitarlo:
      # Claude Code lo carga desde la raíz de la carpeta de trabajo, que no es
      # un repo, así que ahí no tiene historial ni se sincroniza. La copia
      # versionada vive aquí. Dos ficheros derivan solos, de modo que se
      # comparan; si falta el de la raíz no se dice nada, porque en CI y en un
      # clon suelto no existe.
      - id: claude-md-sincronizado
        name: CLAUDE.md coincide con el de la raíz
        entry: |-
          python3 -c "import pathlib,sys; r=pathlib.Path('../CLAUDE.md'); c=pathlib.Path('CLAUDE.md'); sys.exit('CLAUDE.md y ../CLAUDE.md han divergido: copia el bueno sobre el otro' if r.exists() and r.read_bytes()!=c.read_bytes() else 0)"
        language: system
        # always_run, no `files: ^CLAUDE\.md$`: la copia que se edita a diario
        # es la de la RAÍZ, que no está en ningún repo. Si el hook solo mirara
        # cuando este CLAUDE.md va en el commit, la raíz podría reescribirse
        # entera sin que nada saltara —justo lo que se creyó que había pasado—.
        # Comparar dos ficheros son microsegundos; que corra siempre.
        always_run: true
        pass_filenames: false
