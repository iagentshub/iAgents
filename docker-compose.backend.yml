# iAgents Hub — backend standalone desde GitHub Container Registry.

services:
  iagentshub:
    image: ${IMAGE_REPOSITORY:-ghcr.io/iagentshub/backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "${BACKEND_PORT:-8765}:8765"
    environment:
      GAIA_DATA_DIR:             "/data"
      GAIA_HOST:                 "0.0.0.0"
      GAIA_PORT:                 "8765"
      GAIA_RELOAD:               "false"
      GAIA_LLM_MAX_THREADS:      "${GAIA_LLM_MAX_THREADS:-16}"
      GAIA_SQLITE_POOL_SIZE:     "${GAIA_SQLITE_POOL_SIZE:-}"
      GAIA_FRONTEND_URL:         "${GAIA_FRONTEND_URL:-http://localhost:8007}"
      GAIA_CORS_ORIGINS:         "${GAIA_CORS_ORIGINS:-${GAIA_FRONTEND_URL:-http://localhost:8007}}"
      GAIA_AGENTS_SECRET:        "${GAIA_AGENTS_SECRET:-}"
      GAIA_ADMIN_USERNAME:       "${GAIA_ADMIN_USERNAME:-admin}"
      GAIA_ADMIN_EMAIL:          "${GAIA_ADMIN_EMAIL:-admin@localhost.com}"
      GAIA_ADMIN_RESET:          "${GAIA_ADMIN_RESET:-}"
      GAIA_STRICT_CONFIG:        "${GAIA_STRICT_CONFIG:-false}"
      GAIA_REGISTRATION:         "${GAIA_REGISTRATION:-closed}"
      GAIA_EMAIL_VERIFY:         "${GAIA_EMAIL_VERIFY:-false}"
      GAIA_SMTP_HOST:            "${GAIA_SMTP_HOST:-}"
      GAIA_SMTP_PORT:            "${GAIA_SMTP_PORT:-587}"
      GAIA_SMTP_TLS:             "${GAIA_SMTP_TLS:-starttls}"
      GAIA_SMTP_USER:            "${GAIA_SMTP_USER:-}"
      GAIA_SMTP_PASS:            "${GAIA_SMTP_PASS:-}"
      GAIA_SMTP_FROM:            "${GAIA_SMTP_FROM:-}"
      GAIA_WEBMAIL_URL:          "${GAIA_WEBMAIL_URL:-}"
      GAIA_RESET_EXPIRE_HOURS:   "${GAIA_RESET_EXPIRE_HOURS:-1}"
      GAIA_MAX_GUEST_SESSIONS:   "${GAIA_MAX_GUEST_SESSIONS:-0}"
      # PostgreSQL por defecto. DATABASE_URL= (vacío explícito) mantiene
      # SQLite solo para instalaciones antiguas que aún no se hayan migrado.
      DATABASE_URL:              "${DATABASE_URL-postgresql://gaia:${GAIA_DB_PASSWORD:?Define GAIA_DB_PASSWORD en .env}@postgres:5432/iagentshub}"
      GAIA_TRUSTED_PROXIES:      "${GAIA_TRUSTED_PROXIES:-127.0.0.1}"
      GAIA_CSRF_ORIGIN_CHECK:    "${GAIA_CSRF_ORIGIN_CHECK:-enforce}"
      GAIA_CSRF_TOKEN_CHECK:     "${GAIA_CSRF_TOKEN_CHECK:-enforce}"
      STRIPE_SECRET_KEY:         "${STRIPE_SECRET_KEY:-}"
      STRIPE_PUBLISHABLE_KEY:    "${STRIPE_PUBLISHABLE_KEY:-}"
      STRIPE_WEBHOOK_SECRET:     "${STRIPE_WEBHOOK_SECRET:-}"
      IMAGE_REPOSITORY:          "${IMAGE_REPOSITORY:-ghcr.io/iagentshub/backend}"
      IMAGE_VARIANT:             "fastapi"
      IMAGE_TAG:                 "${IMAGE_TAG:-latest}"
      DOCKER_PROXY_URL:          "http://docker-proxy:2375"
      WATCHTOWER_CONTAINER_NAME: "${WATCHTOWER_CONTAINER_NAME:-iagentshub-watchtower}"
    volumes:
      - iagentshub_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('localhost',8765,timeout=5); c.request('GET','/api/health'); r=c.getresponse(); exit(0 if r.status<500 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  watchtower:
    image: nickfedor/watchtower:1.20.2
    container_name: "${WATCHTOWER_CONTAINER_NAME:-iagentshub-watchtower}"
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "${WATCHTOWER_INTERVAL:-3600}"

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: iagentshub
      POSTGRES_USER: gaia
      POSTGRES_PASSWORD: "${GAIA_DB_PASSWORD:?Define GAIA_DB_PASSWORD en .env}"
    volumes:
      - iagentshub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaia -d iagentshub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  iagentshub_data:
  iagentshub_postgres:
