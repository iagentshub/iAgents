name: Build & Push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Cambios en la orquestación (Dockerfile.unified*, gaia.py, entrypoints) afectan a
  # ambas variantes de la imagen unificada — se reconstruyen y publican las dos.
  docker-react:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout iagentshub (Dockerfile + scripts)
        uses: actions/checkout@v4
        with:
          repository: iagentshub/iAgents
          path: iagentshub

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: iagentshub/backend_fastapi
          path: backend

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: iagentshub/frontend_react
          path: frontend

      - name: Checkout Flutter app
        uses: actions/checkout@v4
        with:
          repository: iagentshub/app_flutter
          path: app_flutter

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compilar Flutter Web bajo /app/
        working-directory: app_flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          flutter build web --release --base-href /app/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preparar contexto de build
        run: |
          mkdir -p build-ctx
          cp -r backend/  build-ctx/backend
          cp -r frontend/ build-ctx/frontend
          cp -r app_flutter/build/web build-ctx/flutter-web
          cp iagentshub/docker/Dockerfile.unified     build-ctx/Dockerfile
          cp iagentshub/docker/supervisord.conf       build-ctx/supervisord.conf
          cp iagentshub/docker/entrypoint-unified.sh  build-ctx/entrypoint-unified.sh

      # Versión YYYYMMDDHHMMSS (UTC) — horneada en la imagen (GAIA_VERSION) y
      # publicada como tag inmutable adicional. /api/admin/check-update la
      # compara contra el tag numérico más alto en Docker Hub.
      - name: Generar versión de build
        id: version
        run: echo "value=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      # SHA corto de cada repo empaquetado — GAIA_VERSION solo dice "cuándo" se
      # construyó, no "qué" código de backend/frontend lleva dentro.
      - name: Obtener SHAs de backend y frontend
        id: shas
        run: |
          echo "backend=$(git -C backend rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(git -C frontend rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build y push imagen multi-plataforma
        uses: docker/build-push-action@v5
        with:
          context: build-ctx
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GAIA_VERSION=${{ steps.version.outputs.value }}
            BACKEND_COMMIT=${{ steps.shas.outputs.backend }}
            FRONTEND_COMMIT=${{ steps.shas.outputs.frontend }}
          tags: |
            iagenthub/app:latest
            iagenthub/app:react-${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-vanilla:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout iagentshub (Dockerfile + scripts)
        uses: actions/checkout@v4
        with:
          repository: iagentshub/iAgents
          path: iagentshub

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: iagentshub/backend_fastapi
          path: backend

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: iagentshub/frontend_vanilla
          path: frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preparar contexto de build
        run: |
          mkdir -p build-ctx
          cp -r backend/  build-ctx/backend
          cp -r frontend/ build-ctx/frontend
          cp iagentshub/docker/Dockerfile.unified.vanilla     build-ctx/Dockerfile
          cp iagentshub/docker/supervisord.conf                build-ctx/supervisord.conf
          cp iagentshub/docker/entrypoint-unified-vanilla.sh   build-ctx/entrypoint-unified.sh

      - name: Generar versión de build
        id: version
        run: echo "value=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Obtener SHAs de backend y frontend
        id: shas
        run: |
          echo "backend=$(git -C backend rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(git -C frontend rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build y push imagen multi-plataforma
        uses: docker/build-push-action@v5
        with:
          context: build-ctx
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GAIA_VERSION=${{ steps.version.outputs.value }}
            BACKEND_COMMIT=${{ steps.shas.outputs.backend }}
            FRONTEND_COMMIT=${{ steps.shas.outputs.frontend }}
          tags: |
            iagenthub/app:vanilla
            iagenthub/app:vanilla-${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
