name: Build & Push Docker image

permissions:
  contents: read
  packages: write

concurrency:
  group: unified-image-publish
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Cada repo empaquetado avisa aquí en cuanto su CI pasa en main (ver el paso
  # "Avisar a iAgents" de sus workflows, con IAGENTS_DISPATCH_TOKEN). Su
  # GITHUB_TOKEN no puede disparar este workflow, y el cron de abajo GitHub lo
  # atrasa de 3 a 7 h pese a estar declarado horario: un cambio que solo tocara
  # app_flutter tardaba media tarde en llegar a la imagen desplegada.
  repository_dispatch:
    types: [upstream-push]
  schedule:
    # Respaldo del aviso de arriba: recoge los cambios igual si el PAT caduca o
    # si un repo se queda sin el secreto.
    - cron: "37 * * * *"

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      backend_sha: ${{ steps.revisions.outputs.backend_sha }}
      frontend_sha: ${{ steps.revisions.outputs.frontend_sha }}
      app_sha: ${{ steps.revisions.outputs.app_sha }}
      orchestrator_sha: ${{ steps.revisions.outputs.orchestrator_sha }}
    steps:
      - name: Checkout del orquestador
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # frontend_react es privado, y el GITHUB_TOKEN solo alcanza al repositorio
      # que ejecuta este workflow: mientras los cuatro fueron públicos la API
      # respondía sin permisos, y al privatizar uno este paso empezó a morir con
      # 404. REPO_READ_TOKEN es un PAT que sí lo lee, y necesita permiso de
      # lectura de contenido *y* de Actions: sin el segundo `resolve` pasa y es
      # `verify` el que falla, más tarde y en otro sitio. Sin el secreto se cae
      # de vuelta al token propio y falla en el primer repositorio privado, que
      # es lo correcto: no hay forma de construir la imagen sin ese código.
      - name: Resolver revisiones exactas de main
        id: revisions
        run: python3 scripts/verified_revisions.py resolve
        env:
          GH_TOKEN: ${{ secrets.REPO_READ_TOKEN || github.token }}

      - name: Comprobar si la imagen ya contiene los repos actuales
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE: ghcr.io/iagentshub/app:latest
          BACKEND_SHA: ${{ steps.revisions.outputs.backend_sha }}
          FRONTEND_SHA: ${{ steps.revisions.outputs.frontend_sha }}
          APP_SHA: ${{ steps.revisions.outputs.app_sha }}
        run: |
          # El aviso se compara igual que el cron: tres repos empujando a la
          # vez mandan tres avisos, y sin esto salían tres builds y tres
          # despliegues de la misma imagen.
          case "$EVENT_NAME" in
            schedule|repository_dispatch) ;;
            *) echo "build=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          image_json=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Image}}' 2>/dev/null || true)
          current_backend=$(printf '%s' "$image_json" | jq -r '."linux/amd64".config.Env[]? | select(startswith("BACKEND_COMMIT=")) | split("=")[1]' | head -n1)
          current_frontend=$(printf '%s' "$image_json" | jq -r '."linux/amd64".config.Env[]? | select(startswith("FRONTEND_COMMIT=")) | split("=")[1]' | head -n1)
          current_app=$(printf '%s' "$image_json" | jq -r '."linux/amd64".config.Env[]? | select(startswith("APP_COMMIT=")) | split("=")[1]' | head -n1)

          expected_backend=${BACKEND_SHA:0:7}
          expected_frontend=${FRONTEND_SHA:0:7}
          expected_app=${APP_SHA:0:7}

          if [ "$current_backend" = "$expected_backend" ] && \
             [ "$current_frontend" = "$expected_frontend" ] && \
             [ "$current_app" = "$expected_app" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Esperar los checks de los SHAs empaquetados
        if: steps.decide.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_READ_TOKEN || github.token }}
          BACKEND_SHA: ${{ steps.revisions.outputs.backend_sha }}
          FRONTEND_SHA: ${{ steps.revisions.outputs.frontend_sha }}
          APP_SHA: ${{ steps.revisions.outputs.app_sha }}
          ORCHESTRATOR_SHA: ${{ steps.revisions.outputs.orchestrator_sha }}
        run: |
          python3 scripts/verified_revisions.py verify \
            --require "backend_fastapi:$BACKEND_SHA:test" \
            --require "frontend_react:$FRONTEND_SHA:verify" \
            --require "app_flutter:$APP_SHA:validate" \
            --require "iAgents:$ORCHESTRATOR_SHA:validate"

  # Cambios en la orquestación (Dockerfile.unified*, gaia.py/gaia_cli, entrypoints) afectan a
  # ambas variantes de la imagen unificada — se reconstruyen y publican las dos.
  docker-react:
    needs: preflight
    if: needs.preflight.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_tag: react-${{ steps.version.outputs.value }}

    steps:
      - name: Checkout iagentshub (Dockerfile + scripts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: iagentshub/iAgents
          ref: ${{ needs.preflight.outputs.orchestrator_sha }}
          path: iagentshub

      - name: Checkout backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: iagentshub/backend_fastapi
          ref: ${{ needs.preflight.outputs.backend_sha }}
          path: backend

      - name: Checkout frontend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: iagentshub/frontend_react
          ref: ${{ needs.preflight.outputs.frontend_sha }}
          path: frontend
          # Repositorio privado: sin esto, checkout usa el GITHUB_TOKEN de
          # iAgents, que no lo alcanza.
          token: ${{ secrets.REPO_READ_TOKEN || github.token }}

      - name: Checkout Flutter app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: iagentshub/app_flutter
          ref: ${{ needs.preflight.outputs.app_sha }}
          path: app_flutter

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          # La versión sale del pubspec de app_flutter, que es donde la fija
          # ese repo. Con `channel: stable` a secas, este workflow —que compila
          # la imagen que de verdad se despliega— instalaba lo que hubiera ese
          # día, mientras el CI de app_flutter validaba una versión distinta.
          flutter-version-file: app_flutter/pubspec.yaml
          channel: stable
          cache: true

      - name: Compilar Flutter Web bajo /app/
        working-directory: app_flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          tool/build_web.sh --base-href /app/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar contexto de build
        run: |
          mkdir -p build-ctx
          cp -r backend/  build-ctx/backend
          cp -r frontend/ build-ctx/frontend
          cp -r app_flutter/build/web build-ctx/flutter-web
          cp iagentshub/docker/Dockerfile.unified     build-ctx/Dockerfile
          cp iagentshub/docker/supervisord.conf       build-ctx/supervisord.conf
          cp iagentshub/docker/entrypoint-unified.sh  build-ctx/entrypoint-unified.sh
          # Docker solo lee el .dockerignore de la raíz del contexto, así que
          # el de backend_fastapi no aplica aquí. Sin este, el COPY backend/
          # se lleva docs/, .git y basura del runner; tests/ sí se incluye
          # deliberadamente para Centinel.
          cp iagentshub/docker/dockerignore.unified   build-ctx/.dockerignore

      # Versión YYYYMMDDHHMMSS (UTC) — horneada en la imagen (GAIA_VERSION) y
      # publicada como tag inmutable adicional. /api/admin/check-update la
      # compara contra el tag numérico más alto en GHCR.
      - name: Generar versión de build
        id: version
        run: echo "value=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      # SHA corto de cada repo empaquetado — GAIA_VERSION solo dice "cuándo" se
      # construyó, no "qué" código de backend/frontend/app lleva dentro.
      - name: Obtener SHAs de backend, frontend y app
        id: shas
        run: |
          {
            echo "backend=$(git -C backend rev-parse --short HEAD)"
            echo "frontend=$(git -C frontend rev-parse --short HEAD)"
            echo "app=$(git -C app_flutter rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Build y push imagen multi-plataforma
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: build-ctx
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GAIA_VERSION=${{ steps.version.outputs.value }}
            BACKEND_COMMIT=${{ steps.shas.outputs.backend }}
            FRONTEND_COMMIT=${{ steps.shas.outputs.frontend }}
            APP_COMMIT=${{ steps.shas.outputs.app }}
          tags: |
            ghcr.io/iagentshub/app:latest
            ghcr.io/iagentshub/app:react-${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Desplegar en producción
    needs: [preflight, docker-react]
    if: needs.preflight.outputs.build == 'true' && needs.docker-react.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      BASTION_HOST: 93.189.91.66
      TARGET_HOST: 10.20.10.5
      BASTION_USER: jarivi
      TARGET_USER: iagentshub-deploy
      DEPLOY_PATH: /opt/iagentshub
      IMAGE_TAG: ${{ needs.docker-react.outputs.image_tag }}

    steps:
      - name: Descargar el orquestador verificado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.preflight.outputs.orchestrator_sha }}

      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' \
            'Host iagentshub-bastion' \
            "  HostName $BASTION_HOST" \
            "  User $BASTION_USER" \
            '  IdentityFile ~/.ssh/id_ed25519' \
            '  IdentitiesOnly yes' \
            "  HostKeyAlias $BASTION_HOST" \
            '  StrictHostKeyChecking yes' \
            '  UserKnownHostsFile ~/.ssh/known_hosts' \
            '' \
            'Host iagentshub-target' \
            "  HostName $TARGET_HOST" \
            "  User $TARGET_USER" \
            '  IdentityFile ~/.ssh/id_ed25519' \
            '  IdentitiesOnly yes' \
            "  HostKeyAlias $TARGET_HOST" \
            '  ProxyJump iagentshub-bastion' \
            '  StrictHostKeyChecking yes' \
            '  UserKnownHostsFile ~/.ssh/known_hosts' \
            > ~/.ssh/config
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts ~/.ssh/config

      - name: Transferir la configuración de producción
        run: |
          ssh iagentshub-target \
            "test -d '$DEPLOY_PATH' && test -w '$DEPLOY_PATH'"
          scp docker-compose.hub.yml \
            "iagentshub-target:$DEPLOY_PATH/docker-compose.yml"
          scp deploy/compose.production.override.yml \
            "iagentshub-target:$DEPLOY_PATH/compose.production.override.yml"
          scp deploy/deploy.sh \
            "iagentshub-target:$DEPLOY_PATH/deploy.sh"

      - name: Activar la imagen inmutable
        run: |
          ssh iagentshub-target \
            "cd '$DEPLOY_PATH' && chmod 700 deploy.sh && ./deploy.sh '$IMAGE_TAG'"
