name: Build & Push Docker image

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Cambios en la orquestación (Dockerfile.unified*, gaia.py/gaia_cli, entrypoints) afectan a
  # ambas variantes de la imagen unificada — se reconstruyen y publican las dos.
  docker-react:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout iagentshub (Dockerfile + scripts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: iagentshub/iAgents
          path: iagentshub

      - name: Checkout backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: iagentshub/backend_fastapi
          path: backend

      - name: Checkout frontend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: iagentshub/frontend_react
          path: frontend

      - name: Checkout Flutter app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: iagentshub/app_flutter
          path: app_flutter

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Compilar Flutter Web bajo /app/
        working-directory: app_flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          flutter build web --release --base-href /app/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar contexto de build
        run: |
          mkdir -p build-ctx
          cp -r backend/  build-ctx/backend
          cp -r frontend/ build-ctx/frontend
          cp -r app_flutter/build/web build-ctx/flutter-web
          cp iagentshub/docker/Dockerfile.unified     build-ctx/Dockerfile
          cp iagentshub/docker/supervisord.conf       build-ctx/supervisord.conf
          cp iagentshub/docker/entrypoint-unified.sh  build-ctx/entrypoint-unified.sh

      # Versión YYYYMMDDHHMMSS (UTC) — horneada en la imagen (GAIA_VERSION) y
      # publicada como tag inmutable adicional. /api/admin/check-update la
      # compara contra el tag numérico más alto en GHCR.
      - name: Generar versión de build
        id: version
        run: echo "value=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      # SHA corto de cada repo empaquetado — GAIA_VERSION solo dice "cuándo" se
      # construyó, no "qué" código de backend/frontend/app lleva dentro.
      - name: Obtener SHAs de backend, frontend y app
        id: shas
        run: |
          echo "backend=$(git -C backend rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(git -C frontend rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "app=$(git -C app_flutter rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build y push imagen multi-plataforma
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: build-ctx
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GAIA_VERSION=${{ steps.version.outputs.value }}
            BACKEND_COMMIT=${{ steps.shas.outputs.backend }}
            FRONTEND_COMMIT=${{ steps.shas.outputs.frontend }}
            APP_COMMIT=${{ steps.shas.outputs.app }}
          tags: |
            ghcr.io/iagentshub/app:latest
            ghcr.io/iagentshub/app:react-${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
