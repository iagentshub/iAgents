name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Pasa por gaia.py para crear o reparar .env con los mismos secretos
      # aleatorios que usa un arranque real antes de validar los cinco Compose.
      - name: Validan los 5 composes
        run: python3 gaia.py validate

      - name: Shellcheck install.sh
        run: shellcheck install.sh

      - name: Shellcheck del validador de composes
        run: shellcheck scripts/validar-composes.sh

      # El entrypoint de la imagen unificada no lo comprobaba nadie, y es el
      # que decide si el contenedor arranca.
      - name: Shellcheck del entrypoint unificado
        run: shellcheck docker/entrypoint-unified.sh

      # El gemelo Windows de install.sh no tenía linter, y se pasó por alto que
      # el fichero estaba en UTF-8 SIN BOM: Windows PowerShell 5.1 —el shell por
      # defecto de Windows— lo lee como ANSI, parte los caracteres de caja de las
      # cabeceras, y a partir de ahí los '>' de las líneas siguientes se leen como
      # redirecciones. 25 errores de parseo: el instalador no arrancaba salvo
      # bajo pwsh 7. Se comprueban solo Error y ParseError a propósito; las 85
      # advertencias de estilo que quedan son casi todas Write-Host, que en un
      # instalador de consola es lo correcto.
      - name: PSScriptAnalyzer install.ps1
        shell: pwsh
        run: |
          # El BOM se comprueba a mano y no con la regla del analizador porque
          # este runner es pwsh 7 sobre Linux, que lee UTF-8 sin BOM
          # perfectamente: el fallo solo existe en PS 5.1. Si CI se limitara a
          # parsear, quitar el BOM volvería a pasar desapercibido.
          $b = [IO.File]::ReadAllBytes("install.ps1")
          if ($b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) {
            Write-Host "install.ps1 ha perdido el BOM UTF-8: no parseará en Windows PowerShell 5.1"
            exit 1
          }
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error,ParseError
          if ($r) { $r | Format-Table -AutoSize | Out-String -Width 200 | Write-Host; exit 1 }
          Write-Host "install.ps1: BOM presente y sin errores de parseo"

      - name: Compila gaia.py y sus módulos
        run: python3 -m compileall -q gaia.py gaia_cli

      - name: Ruff gaia.py y sus módulos
        run: >-
          pipx run ruff check gaia.py gaia_cli scripts/verified_revisions.py
          tests/test_verified_revisions.py tests/test_docker_contexto.py

      - name: Tests de la orquestacion de despliegues
        run: pipx run pytest -q tests/test_verified_revisions.py
